DATASOURCE_TYPE_LABEL = Amazon S3 (custom)
DATASOURCE_TYPE_DESCRIPTION = Files stored in an Amazon S3 bucket
CONNECTION_BUCKET_LABEL = Bucket
CONNECTION_BUCKET_DESCRIPTION = The name of the S3 bucket
CONNECTION_REGION_LABEL = Region
CONNECTION_REGION_DESCRIPTION = The AWS region where the bucket resides (e.g. us-east-1)
CONNECTION_ENDPOINT_URL_LABEL = Endpoint URL
CONNECTION_ENDPOINT_URL_DESCRIPTION = Custom endpoint URL for S3-compatible stores (e.g. MinIO, LocalStack)
CONNECTION_ACCESS_KEY_ID_LABEL = Access key ID
CONNECTION_ACCESS_KEY_ID_DESCRIPTION = AWS access key ID used for authentication
CONNECTION_SECRET_ACCESS_KEY_LABEL = Secret access key
CONNECTION_SECRET_ACCESS_KEY_DESCRIPTION = AWS secret access key used for authentication
SOURCE_FILE_NAME_LABEL = Object key
SOURCE_FILE_NAME_DESCRIPTION = The key (path) of the S3 object to read
SOURCE_FILE_FORMAT_BINARY_LABEL = Binary (raw bytes)
ACTION_GET_ACL_LABEL = Get ACL
ACTION_GET_ACL_DESCRIPTION = Retrieve the access control list (ACL) for an S3 object
ACTION_GET_ACL_INPUT_PATH_LABEL = Path
ACTION_GET_ACL_INPUT_PATH_DESCRIPTION = The key (path) of the S3 object whose ACL to retrieve
ACTION_GET_ACL_OUTPUT_ALLOW_LABEL = Allow
ACTION_GET_ACL_OUTPUT_ALLOW_DESCRIPTION = Identities (users and groups) with read access to the object
ACTION_GET_ACL_OUTPUT_DENY_LABEL = Deny
ACTION_GET_ACL_OUTPUT_DENY_DESCRIPTION = Identities (users and groups) explicitly denied access (empty for S3 ACLs)
ACTION_GET_FILE_METADATA_DESCRIPTION = Retrieve file metadata (last modified date and size) for an S3 object
ACTION_GET_FILE_METADATA_INPUT_PATH_LABEL = Path
ACTION_GET_FILE_METADATA_INPUT_PATH_DESCRIPTION = The key (path) of the S3 object whose metadata to retrieve
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_LABEL = Last modified
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_DESCRIPTION = The date and time the object was last modified (ISO-8601 UTC)
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_LABEL = Size
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_DESCRIPTION = The size of the object in bytes
