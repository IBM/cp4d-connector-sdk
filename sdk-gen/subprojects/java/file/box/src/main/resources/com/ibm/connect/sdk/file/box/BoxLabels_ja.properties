DATASOURCE_TYPE_LABEL = Box (カスタム)
DATASOURCE_TYPE_DESCRIPTION = Box に保存されたファイル
CONNECTION_CLIENT_ID_LABEL = クライアント ID
CONNECTION_CLIENT_ID_DESCRIPTION = Box アプリケーション設定ファイルのクライアント ID
CONNECTION_CLIENT_SECRET_LABEL = クライアント・シークレット
CONNECTION_CLIENT_SECRET_DESCRIPTION = Box アプリケーション設定ファイルのクライアント・シークレット
CONNECTION_ENTERPRISE_ID_LABEL = エンタープライズ ID
CONNECTION_ENTERPRISE_ID_DESCRIPTION = Box アプリケーション設定ファイルのエンタープライズ ID
CONNECTION_PRIVATE_KEY_LABEL = 秘密鍵
CONNECTION_PRIVATE_KEY_DESCRIPTION = Box アプリケーション設定ファイルの PEM エンコードされた秘密鍵
CONNECTION_PRIVATE_KEY_PASSWORD_LABEL = 秘密鍵のパスワード
CONNECTION_PRIVATE_KEY_PASSWORD_DESCRIPTION = 秘密鍵のパスフレーズ
CONNECTION_PUBLIC_KEY_LABEL = 公開鍵 ID
CONNECTION_PUBLIC_KEY_DESCRIPTION = Box アプリケーション設定ファイルの公開鍵 ID
CONNECTION_USERNAME_LABEL = ユーザー名
CONNECTION_USERNAME_DESCRIPTION = Box ユーザーのメールアドレス。省略するとエンタープライズ・サービス・アカウントで認証
SOURCE_FILE_NAME_LABEL = ファイル名
SOURCE_FILE_NAME_DESCRIPTION = Box からダウンロードするファイル名
SOURCE_FILE_FORMAT_BINARY_LABEL = バイナリー (生バイト)
ACTION_GET_ACL_DESCRIPTION = Box ファイルまたはフォルダーのアクセス制御リスト (ACL) を取得
ACTION_GET_ACL_INPUT_PATH_LABEL = パス
ACTION_GET_ACL_INPUT_PATH_DESCRIPTION = ACL を取得する Box ファイルまたはフォルダーのパス
ACTION_GET_ACL_OUTPUT_ALLOW_LABEL = 許可
ACTION_GET_ACL_OUTPUT_ALLOW_DESCRIPTION = アイテムにアクセスできるアイデンティティー (ユーザーとグループ)
ACTION_GET_ACL_OUTPUT_DENY_LABEL = 拒否
ACTION_GET_ACL_OUTPUT_DENY_DESCRIPTION = 明示的に拒否されたアイデンティティー (Box ACL では空)
ACTION_GET_FILE_METADATA_DESCRIPTION = Box ファイルのファイルメタデータ (最終更新日時とサイズ) を取得
ACTION_GET_FILE_METADATA_INPUT_PATH_LABEL = パス
ACTION_GET_FILE_METADATA_INPUT_PATH_DESCRIPTION = メタデータを取得する Box ファイルのパス
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_LABEL = 最終更新
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_DESCRIPTION = ファイルの最終更新日時 (ISO-8601 UTC)
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_LABEL = サイズ
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_DESCRIPTION = ファイルのサイズ (バイト)
TARGET_FILE_NAME_LABEL = ファイル名
TARGET_FILE_NAME_DESCRIPTION = Box で作成または置換するファイルのパス
TARGET_FILE_FORMAT_BINARY_LABEL = バイナリー (生バイト)
