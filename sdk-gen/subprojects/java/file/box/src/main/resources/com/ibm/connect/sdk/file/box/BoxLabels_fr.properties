CONNECTION_PRIVATE_KEY_PASSWORD_DESCRIPTION = Phrase secrète pour la clé privée
CONNECTION_PUBLIC_KEY_LABEL = ID de clé publique
CONNECTION_PUBLIC_KEY_DESCRIPTION = ID de clé publique issu du fichier de configuration de l'application Box
