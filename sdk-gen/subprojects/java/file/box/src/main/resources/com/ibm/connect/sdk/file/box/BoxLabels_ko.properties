CONNECTION_CLIENT_SECRET_LABEL = 클라이언트 비밀
CONNECTION_CLIENT_SECRET_DESCRIPTION = Box 애플리케이션 구성 파일의 클라이언트 비밀
CONNECTION_ENTERPRISE_ID_LABEL = 엔터프라이즈 ID
CONNECTION_ENTERPRISE_ID_DESCRIPTION = Box 애플리케이션 구성 파일의 엔터프라이즈 ID
CONNECTION_PRIVATE_KEY_LABEL = 개인 키
CONNECTION_PRIVATE_KEY_DESCRIPTION = Box 애플리케이션 구성 파일의 PEM 인코딩된 개인 키
CONNECTION_PRIVATE_KEY_PASSWORD_LABEL = 개인 키 비밀번호
CONNECTION_PRIVATE_KEY_PASSWORD_DESCRIPTION = 개인 키 패스프레이즈
CONNECTION_PUBLIC_KEY_LABEL = 공개 키 ID
