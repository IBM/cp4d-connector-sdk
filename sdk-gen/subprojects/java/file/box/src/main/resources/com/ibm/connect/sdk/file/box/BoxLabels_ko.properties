CONNECTION_USERNAME_LABEL = 사용자 이름
CONNECTION_USERNAME_DESCRIPTION = Box 사용자의 이메일 주소; 생략하면 엔터프라이즈 서비스 계정으로 인증
SOURCE_FILE_NAME_LABEL = 파일 이름
