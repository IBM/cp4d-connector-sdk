DATASOURCE_TYPE_LABEL = OneDrive（自定义）
DATASOURCE_TYPE_DESCRIPTION = 存储在 OneDrive 中的文件
SOURCE_FILE_NAME_LABEL = 文件名
SOURCE_FILE_NAME_DESCRIPTION = OneDrive 中要下载的文件名
SOURCE_FILE_FORMAT_BINARY_LABEL = 二进制（原始字节）
ACTION_GET_ACL_DESCRIPTION = 检索 OneDrive 文件或文件夹的访问控制列表 (ACL)
ACTION_GET_ACL_INPUT_PATH_LABEL = 路径
ACTION_GET_ACL_INPUT_PATH_DESCRIPTION = 要检索 ACL 的 OneDrive 文件或文件夹的路径
ACTION_GET_ACL_OUTPUT_ALLOW_LABEL = 允许
ACTION_GET_ACL_OUTPUT_ALLOW_DESCRIPTION = 可访问该项目的身份（用户和组）
ACTION_GET_ACL_OUTPUT_DENY_LABEL = 拒绝
ACTION_GET_ACL_OUTPUT_DENY_DESCRIPTION = 被明确拒绝的身份（OneDrive ACL 为空）
ACTION_GET_FILE_METADATA_DESCRIPTION = 检索 OneDrive 文件的文件元数据（最后修改日期和大小）
ACTION_GET_FILE_METADATA_INPUT_PATH_LABEL = 路径
ACTION_GET_FILE_METADATA_INPUT_PATH_DESCRIPTION = 要检索元数据的 OneDrive 文件的路径
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_LABEL = 最后修改
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_DESCRIPTION = 文件最后修改的日期和时间 (ISO-8601 UTC)
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_LABEL = 大小
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_DESCRIPTION = 文件大小（字节）
TARGET_FILE_NAME_LABEL = 文件名
TARGET_FILE_NAME_DESCRIPTION = OneDrive 中要创建或替换的文件路径
TARGET_FILE_FORMAT_BINARY_LABEL = 二进制（原始字节）
CONNECTION_TENANT_ID_LABEL = 租户 ID
CONNECTION_TENANT_ID_DESCRIPTION = Azure AD 租户 ID
CONNECTION_CLIENT_ID_LABEL = 客户端 ID
CONNECTION_CLIENT_ID_DESCRIPTION = 应用程序注册客户端 ID
CONNECTION_USERNAME_LABEL = 用户名
CONNECTION_USERNAME_DESCRIPTION = OneDrive 用户账户（例：user@tenant.onmicrosoft.com）
CONNECTION_PASSWORD_LABEL = 密码
CONNECTION_PASSWORD_DESCRIPTION = OneDrive 用户密码
CONNECTION_CLIENT_SECRET_LABEL = 客户端密鑰
CONNECTION_CLIENT_SECRET_DESCRIPTION = 应用程序注册客户端密鑰（可选）
