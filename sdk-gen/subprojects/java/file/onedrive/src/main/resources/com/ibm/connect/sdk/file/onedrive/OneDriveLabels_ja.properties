CONNECTION_USERNAME_DESCRIPTION = OneDrive ユーザーアカウント (例: user@tenant.onmicrosoft.com)
CONNECTION_PASSWORD_LABEL = パスワード
CONNECTION_PASSWORD_DESCRIPTION = OneDrive ユーザーパスワード
CONNECTION_CLIENT_SECRET_LABEL = クライアント・シークレット
