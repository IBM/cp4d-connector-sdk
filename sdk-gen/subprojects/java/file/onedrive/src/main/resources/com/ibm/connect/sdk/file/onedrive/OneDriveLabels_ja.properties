DATASOURCE_TYPE_LABEL = OneDrive (カスタム)
DATASOURCE_TYPE_DESCRIPTION = OneDrive に保存されたファイル
SOURCE_FILE_NAME_LABEL = ファイル名
SOURCE_FILE_NAME_DESCRIPTION = OneDrive からダウンロードするファイル名
SOURCE_FILE_FORMAT_BINARY_LABEL = バイナリー (生バイト)
ACTION_GET_ACL_DESCRIPTION = OneDrive ファイルまたはフォルダーのアクセス制御リスト (ACL) を取得
ACTION_GET_ACL_INPUT_PATH_LABEL = パス
ACTION_GET_ACL_INPUT_PATH_DESCRIPTION = ACL を取得する OneDrive ファイルまたはフォルダーのパス
ACTION_GET_ACL_OUTPUT_ALLOW_LABEL = 許可
ACTION_GET_ACL_OUTPUT_ALLOW_DESCRIPTION = アイテムにアクセスできるアイデンティティー (ユーザーとグループ)
ACTION_GET_ACL_OUTPUT_DENY_LABEL = 拒否
ACTION_GET_ACL_OUTPUT_DENY_DESCRIPTION = 明示的に拒否されたアイデンティティー (OneDrive ACL では空)
ACTION_GET_FILE_METADATA_DESCRIPTION = OneDrive ファイルのファイルメタデータ (最終更新日時とサイズ) を取得
ACTION_GET_FILE_METADATA_INPUT_PATH_LABEL = パス
ACTION_GET_FILE_METADATA_INPUT_PATH_DESCRIPTION = メタデータを取得する OneDrive ファイルのパス
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_LABEL = 最終更新
