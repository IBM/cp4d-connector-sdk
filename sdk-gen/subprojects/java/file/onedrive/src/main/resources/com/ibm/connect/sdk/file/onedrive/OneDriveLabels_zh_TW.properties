DATASOURCE_TYPE_LABEL = OneDrive（自訂）
DATASOURCE_TYPE_DESCRIPTION = 儲存於 OneDrive 中的檔案
SOURCE_FILE_NAME_LABEL = 檔案名稱
SOURCE_FILE_NAME_DESCRIPTION = OneDrive 中要下載的檔案名稱
SOURCE_FILE_FORMAT_BINARY_LABEL = 二進位（原始位元組）
ACTION_GET_ACL_DESCRIPTION = 擷取 OneDrive 檔案或資料夾的存取控制清單 (ACL)
ACTION_GET_ACL_INPUT_PATH_LABEL = 路徑
ACTION_GET_ACL_INPUT_PATH_DESCRIPTION = 要擷取 ACL 的 OneDrive 檔案或資料夾的路徑
ACTION_GET_ACL_OUTPUT_ALLOW_LABEL = 允許
ACTION_GET_ACL_OUTPUT_ALLOW_DESCRIPTION = 可存取項目的身份（使用者和群組）
ACTION_GET_ACL_OUTPUT_DENY_LABEL = 拒絕
ACTION_GET_ACL_OUTPUT_DENY_DESCRIPTION = 被明確拒絕的身份（OneDrive ACL 為空）
ACTION_GET_FILE_METADATA_DESCRIPTION = 擷取 OneDrive 檔案的檔案描述資料（最後修改日期與大小）
ACTION_GET_FILE_METADATA_INPUT_PATH_LABEL = 路徑
ACTION_GET_FILE_METADATA_INPUT_PATH_DESCRIPTION = 要擷取描述資料的 OneDrive 檔案的路徑
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_LABEL = 最後修改
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_DESCRIPTION = 檔案最後修改的日期和時間 (ISO-8601 UTC)
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_LABEL = 大小
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_DESCRIPTION = 檔案大小（位元組）
TARGET_FILE_NAME_LABEL = 檔案名稱
TARGET_FILE_NAME_DESCRIPTION = OneDrive 中要建立或取代的檔案路徑
TARGET_FILE_FORMAT_BINARY_LABEL = 二進位（原始位元組）
CONNECTION_TENANT_ID_LABEL = 租戶 ID
CONNECTION_TENANT_ID_DESCRIPTION = Azure AD 租戶 ID
CONNECTION_CLIENT_ID_LABEL = 用戶端 ID
CONNECTION_CLIENT_ID_DESCRIPTION = 應用程式登錄用戶端 ID
CONNECTION_USERNAME_LABEL = 使用者名稱
CONNECTION_USERNAME_DESCRIPTION = OneDrive 使用者帳號（例：user@tenant.onmicrosoft.com）
CONNECTION_PASSWORD_LABEL = 密碼
CONNECTION_PASSWORD_DESCRIPTION = OneDrive 使用者密碼
CONNECTION_CLIENT_SECRET_LABEL = 用戶端密鑰
CONNECTION_CLIENT_SECRET_DESCRIPTION = 應用程式登錄用戶端密鑰（選用）
