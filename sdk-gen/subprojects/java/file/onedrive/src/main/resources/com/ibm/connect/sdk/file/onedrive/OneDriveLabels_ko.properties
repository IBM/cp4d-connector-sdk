DATASOURCE_TYPE_LABEL = OneDrive (코스텀)
DATASOURCE_TYPE_DESCRIPTION = OneDrive에 저장된 파일
SOURCE_FILE_NAME_LABEL = 파일 이름
SOURCE_FILE_NAME_DESCRIPTION = OneDrive에서 다운로드할 파일 이름
SOURCE_FILE_FORMAT_BINARY_LABEL = 이진수 (원시 바이트)
ACTION_GET_ACL_DESCRIPTION = OneDrive 파일 또는 폴더의 액세스 제어 목록(ACL) 검색
ACTION_GET_ACL_INPUT_PATH_LABEL = 경로
ACTION_GET_ACL_INPUT_PATH_DESCRIPTION = ACL을 검색할 OneDrive 파일 또는 폴더의 경로
ACTION_GET_ACL_OUTPUT_ALLOW_LABEL = 허용
ACTION_GET_ACL_OUTPUT_ALLOW_DESCRIPTION = 항목에 액세스할 수 있는 신원(사용자 및 그룹)
ACTION_GET_ACL_OUTPUT_DENY_LABEL = 거부
ACTION_GET_ACL_OUTPUT_DENY_DESCRIPTION = 명시적으로 거부된 신원(OneDrive ACL의 경우 비어 있음)
ACTION_GET_FILE_METADATA_DESCRIPTION = OneDrive 파일의 파일 메타데이터(마지막 수정 날짜 및 크기) 검색
ACTION_GET_FILE_METADATA_INPUT_PATH_LABEL = 경로
ACTION_GET_FILE_METADATA_INPUT_PATH_DESCRIPTION = 메타데이터를 검색할 OneDrive 파일의 경로
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_LABEL = 마지막 수정
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_DESCRIPTION = 파일의 마지막 수정 날짜 및 시간(ISO-8601 UTC)
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_LABEL = 크기
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_DESCRIPTION = 파일 크기(바이트)
TARGET_FILE_NAME_LABEL = 파일 이름
TARGET_FILE_NAME_DESCRIPTION = OneDrive에서 생성하거나 교체할 파일의 경로
TARGET_FILE_FORMAT_BINARY_LABEL = 이진수 (원시 바이트)
CONNECTION_TENANT_ID_LABEL = 테넌트 ID
CONNECTION_TENANT_ID_DESCRIPTION = Azure AD 테넌트 ID
CONNECTION_CLIENT_ID_LABEL = 클라이언트 ID
CONNECTION_CLIENT_ID_DESCRIPTION = 앱 등록 클라이언트 ID
CONNECTION_USERNAME_LABEL = 사용자 이름
CONNECTION_USERNAME_DESCRIPTION = OneDrive 사용자 계정 (예: user@tenant.onmicrosoft.com)
CONNECTION_PASSWORD_LABEL = 비밀번호
CONNECTION_PASSWORD_DESCRIPTION = OneDrive 사용자 비밀번호
CONNECTION_CLIENT_SECRET_LABEL = 클라이언트 비밀
CONNECTION_CLIENT_SECRET_DESCRIPTION = 앱 등록 클라이언트 비밀 (선택 사항)
