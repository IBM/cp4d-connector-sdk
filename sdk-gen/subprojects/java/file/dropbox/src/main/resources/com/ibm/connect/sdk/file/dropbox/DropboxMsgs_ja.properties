FILE_NOT_FOUND = Dropbox にファイル ''{0}'' が見つかりませんでした
FOLDER_NOT_FOUND = Dropbox にフォルダー ''{0}'' が見つかりませんでした
MISSING_AUTH_CREDENTIALS = Dropbox 認証には ''access_token'' または ''refresh_token'' + ''app_key'' + ''app_secret'' が必要です
