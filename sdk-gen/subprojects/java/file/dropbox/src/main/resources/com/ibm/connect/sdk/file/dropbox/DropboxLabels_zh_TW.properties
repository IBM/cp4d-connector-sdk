DATASOURCE_TYPE_LABEL = Dropbox
DATASOURCE_TYPE_DESCRIPTION = 儲存於 Dropbox 中的檔案
SOURCE_FILE_NAME_LABEL = 檔案名稱
SOURCE_FILE_NAME_DESCRIPTION = Dropbox 中要下載的檔案名稱
SOURCE_FILE_FORMAT_BINARY_LABEL = 二進位（原始位元組）
ACTION_GET_ACL_DESCRIPTION = 擷取 Dropbox 檔案或資料夾的存取控制清單 (ACL)
ACTION_GET_ACL_INPUT_PATH_LABEL = 路徑
ACTION_GET_ACL_INPUT_PATH_DESCRIPTION = 要擷取 ACL 的 Dropbox 檔案或資料夾的路徑
ACTION_GET_ACL_OUTPUT_ALLOW_LABEL = 允許
ACTION_GET_ACL_OUTPUT_ALLOW_DESCRIPTION = 可存取項目的身份（使用者和群組）
ACTION_GET_ACL_OUTPUT_DENY_LABEL = 拒絕
ACTION_GET_ACL_OUTPUT_DENY_DESCRIPTION = 被明確拒絕的身份（Dropbox ACL 為空）
ACTION_GET_FILE_METADATA_DESCRIPTION = 擷取 Dropbox 檔案的檔案描述資料（最後修改日期與大小）
ACTION_GET_FILE_METADATA_INPUT_PATH_LABEL = 路徑
ACTION_GET_FILE_METADATA_INPUT_PATH_DESCRIPTION = 要擷取描述資料的 Dropbox 檔案的路徑
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_LABEL = 最後修改
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_DESCRIPTION = 檔案最後修改的日期和時間 (ISO-8601 UTC)
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_LABEL = 大小
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_DESCRIPTION = 檔案大小（位元組）
TARGET_FILE_NAME_LABEL = 檔案名稱
TARGET_FILE_NAME_DESCRIPTION = Dropbox 中要建立或取代的檔案路徑
TARGET_FILE_FORMAT_BINARY_LABEL = 二進位（原始位元組）
CONNECTION_ACCESS_TOKEN_LABEL = 存取令牌
CONNECTION_ACCESS_TOKEN_DESCRIPTION = Dropbox OAuth2 長期存取令牌
CONNECTION_REFRESH_TOKEN_LABEL = 重新整理令牌
CONNECTION_REFRESH_TOKEN_DESCRIPTION = 用於取得新存取令牌的 Dropbox OAuth2 重新整理令牌
CONNECTION_APP_KEY_LABEL = 應用程式密鑰
CONNECTION_APP_KEY_DESCRIPTION = 重新整理令牌流中使用的 Dropbox 應用程式密鑰（用戶端 ID）
CONNECTION_APP_SECRET_LABEL = 應用程式密鑰
CONNECTION_APP_SECRET_DESCRIPTION = 重新整理令牌流中使用的 Dropbox 應用程式密鑰（用戶端密鑰）
