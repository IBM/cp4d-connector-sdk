DATASOURCE_TYPE_LABEL = Dropbox
DATASOURCE_TYPE_DESCRIPTION = Dropbox に保存されたファイル
SOURCE_FILE_NAME_LABEL = ファイル名
SOURCE_FILE_NAME_DESCRIPTION = Dropbox からダウンロードするファイル名
SOURCE_FILE_FORMAT_BINARY_LABEL = バイナリー (生バイト)
ACTION_GET_ACL_DESCRIPTION = Dropbox ファイルまたはフォルダーのアクセス制御リスト (ACL) を取得
ACTION_GET_ACL_INPUT_PATH_LABEL = パス
ACTION_GET_ACL_INPUT_PATH_DESCRIPTION = ACL を取得する Dropbox ファイルまたはフォルダーのパス
ACTION_GET_ACL_OUTPUT_ALLOW_LABEL = 許可
ACTION_GET_ACL_OUTPUT_ALLOW_DESCRIPTION = アイテムにアクセスできるアイデンティティー (ユーザーとグループ)
ACTION_GET_ACL_OUTPUT_DENY_LABEL = 拒否
ACTION_GET_ACL_OUTPUT_DENY_DESCRIPTION = 明示的に拒否されたアイデンティティー (Dropbox ACL では空)
ACTION_GET_FILE_METADATA_DESCRIPTION = Dropbox ファイルのファイルメタデータ (最終更新日時とサイズ) を取得
ACTION_GET_FILE_METADATA_INPUT_PATH_LABEL = パス
ACTION_GET_FILE_METADATA_INPUT_PATH_DESCRIPTION = メタデータを取得する Dropbox ファイルのパス
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_LABEL = 最終更新
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_DESCRIPTION = ファイルの最終更新日時 (ISO-8601 UTC)
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_LABEL = サイズ
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_DESCRIPTION = ファイルのサイズ (バイト)
TARGET_FILE_NAME_LABEL = ファイル名
TARGET_FILE_NAME_DESCRIPTION = Dropbox で作成または置換するファイルのパス
TARGET_FILE_FORMAT_BINARY_LABEL = バイナリー (生バイト)
CONNECTION_ACCESS_TOKEN_LABEL = アクセス・トークン
CONNECTION_ACCESS_TOKEN_DESCRIPTION = Dropbox OAuth2 長期アクセス・トークン
CONNECTION_REFRESH_TOKEN_LABEL = リフレッシュ・トークン
CONNECTION_REFRESH_TOKEN_DESCRIPTION = 新しいアクセス・トークンを取得するための Dropbox OAuth2 リフレッシュ・トークン
CONNECTION_APP_KEY_LABEL = アプリ・キー
CONNECTION_APP_KEY_DESCRIPTION = リフレッシュ・トークン・フローの Dropbox アプリケーション・キー (クライアント ID)
CONNECTION_APP_SECRET_LABEL = アプリ・シークレット
CONNECTION_APP_SECRET_DESCRIPTION = リフレッシュ・トークン・フローの Dropbox アプリケーション・シークレット (クライアント・シークレット)
