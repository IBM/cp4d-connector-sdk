DATASOURCE_TYPE_LABEL = Dropbox
DATASOURCE_TYPE_DESCRIPTION = Files stored in Dropbox
CONNECTION_ACCESS_TOKEN_LABEL = Access Token
CONNECTION_ACCESS_TOKEN_DESCRIPTION = Dropbox OAuth2 long-lived access token
CONNECTION_REFRESH_TOKEN_LABEL = Refresh Token
CONNECTION_REFRESH_TOKEN_DESCRIPTION = Dropbox OAuth2 refresh token used to obtain a new access token
CONNECTION_APP_KEY_LABEL = App Key
CONNECTION_APP_KEY_DESCRIPTION = Dropbox application key (client ID) used with the refresh token flow
CONNECTION_APP_SECRET_LABEL = App Secret
CONNECTION_APP_SECRET_DESCRIPTION = Dropbox application secret (client secret) used with the refresh token flow
SOURCE_FILE_NAME_LABEL = File name
SOURCE_FILE_NAME_DESCRIPTION = Path of the file in Dropbox to download (e.g. /folder/file.txt)
SOURCE_FILE_FORMAT_BINARY_LABEL = Binary (raw bytes)
TARGET_FILE_NAME_LABEL = File name
TARGET_FILE_NAME_DESCRIPTION = Path of the file in Dropbox to create or replace (e.g. /folder/file.txt)
TARGET_FILE_FORMAT_BINARY_LABEL = Binary (raw bytes)
ACTION_GET_ACL_DESCRIPTION = Retrieve the access control list (ACL) for a Dropbox file or folder
ACTION_GET_ACL_INPUT_PATH_LABEL = Path
ACTION_GET_ACL_INPUT_PATH_DESCRIPTION = The path of the Dropbox file or folder whose ACL to retrieve
ACTION_GET_ACL_OUTPUT_ALLOW_LABEL = Allow
ACTION_GET_ACL_OUTPUT_ALLOW_DESCRIPTION = Identities (users and groups) with access to the item
ACTION_GET_ACL_OUTPUT_DENY_LABEL = Deny
ACTION_GET_ACL_OUTPUT_DENY_DESCRIPTION = Identities explicitly denied access (empty for Dropbox ACLs)
ACTION_GET_FILE_METADATA_DESCRIPTION = Retrieve file metadata (last modified date, size, rev, id) for a Dropbox file
ACTION_GET_FILE_METADATA_INPUT_PATH_LABEL = Path
ACTION_GET_FILE_METADATA_INPUT_PATH_DESCRIPTION = The path of the Dropbox file whose metadata to retrieve
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_LABEL = Last modified
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_DESCRIPTION = The date and time the file was last modified on the server (ISO-8601 UTC)
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_LABEL = Size
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_DESCRIPTION = The size of the file in bytes
