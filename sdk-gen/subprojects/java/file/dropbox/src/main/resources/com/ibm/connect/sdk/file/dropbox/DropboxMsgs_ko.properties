FILE_NOT_FOUND = Dropbox에서 ''{0}'' 파일을 찾을 수 없습니다
FOLDER_NOT_FOUND = Dropbox에서 ''{0}'' 폴더를 찾을 수 없습니다
MISSING_AUTH_CREDENTIALS = Dropbox 인증에는 ''access_token'' 또는 ''refresh_token'' + ''app_key'' + ''app_secret''가 필요합니다
