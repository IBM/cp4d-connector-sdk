DATASOURCE_TYPE_LABEL = Dropbox
DATASOURCE_TYPE_DESCRIPTION = Dropbox에 저장된 파일
SOURCE_FILE_NAME_LABEL = 파일 이름
SOURCE_FILE_NAME_DESCRIPTION = Dropbox에서 다운로드할 파일 이름
SOURCE_FILE_FORMAT_BINARY_LABEL = 이진수 (원시 바이트)
ACTION_GET_ACL_DESCRIPTION = Dropbox 파일 또는 폴더의 액세스 제어 목록(ACL) 검색
ACTION_GET_ACL_INPUT_PATH_LABEL = 경로
ACTION_GET_ACL_INPUT_PATH_DESCRIPTION = ACL을 검색할 Dropbox 파일 또는 폴더의 경로
ACTION_GET_ACL_OUTPUT_ALLOW_LABEL = 허용
ACTION_GET_ACL_OUTPUT_ALLOW_DESCRIPTION = 항목에 액세스할 수 있는 신원(사용자 및 그룹)
ACTION_GET_ACL_OUTPUT_DENY_LABEL = 거부
ACTION_GET_ACL_OUTPUT_DENY_DESCRIPTION = 명시적으로 거부된 신원(Dropbox ACL의 경우 비어 있음)
ACTION_GET_FILE_METADATA_DESCRIPTION = Dropbox 파일의 파일 메타데이터(마지막 수정 날짜 및 크기) 검색
ACTION_GET_FILE_METADATA_INPUT_PATH_LABEL = 경로
ACTION_GET_FILE_METADATA_INPUT_PATH_DESCRIPTION = 메타데이터를 검색할 Dropbox 파일의 경로
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_LABEL = 마지막 수정
ACTION_GET_FILE_METADATA_OUTPUT_LAST_MODIFIED_DESCRIPTION = 파일의 마지막 수정 날짜 및 시간(ISO-8601 UTC)
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_LABEL = 크기
ACTION_GET_FILE_METADATA_OUTPUT_SIZE_DESCRIPTION = 파일 크기(바이트)
TARGET_FILE_NAME_LABEL = 파일 이름
TARGET_FILE_NAME_DESCRIPTION = Dropbox에서 생성하거나 교체할 파일의 경로
TARGET_FILE_FORMAT_BINARY_LABEL = 이진수 (원시 바이트)
CONNECTION_ACCESS_TOKEN_LABEL = 액세스 토큰
CONNECTION_ACCESS_TOKEN_DESCRIPTION = Dropbox OAuth2 장기 액세스 토큰
CONNECTION_REFRESH_TOKEN_LABEL = 새로 고침 토큰
CONNECTION_REFRESH_TOKEN_DESCRIPTION = 새 액세스 토큰을 가져오는 데 사용되는 Dropbox OAuth2 새로 고침 토큰
CONNECTION_APP_KEY_LABEL = 앱 키
CONNECTION_APP_KEY_DESCRIPTION = 새로 고침 토큰 흐름에 사용되는 Dropbox 애플리케이션 키(클라이언트 ID)
CONNECTION_APP_SECRET_LABEL = 앱 비밀
CONNECTION_APP_SECRET_DESCRIPTION = 새로 고침 토큰 흐름에 사용되는 Dropbox 애플리케이션 비밀(클라이언트 비밀)
